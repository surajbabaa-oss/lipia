name: Build LipikaFusionPRO v3 - Node24 Ready
on: [push, workflow_dispatch]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Test Node24 now - Required after June 16 2026

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4  # v4 is Node24 compatible
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: choco install innosetup -y
      - run: |
          dotnet restore
          dotnet build -c Release
          dotnet publish src/LipikaFusion.App/LipikaFusion.App.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish/win-x64
          iscc installer/LipikaFusion.iss
      - uses: actions/upload-artifact@v4  # v4 is Node24 compatible
        with:
          name: LipikaFusionPRO-v3-Node24
          path: artifacts/installer/*.exe
